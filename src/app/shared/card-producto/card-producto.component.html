<div class="max-w-sm rounded-lg overflow-hidden shadow-lg bg-white transition-transform duration-300 hover:scale-105 mx-auto">
    
    <img
        *ngIf="producto.imagen" 
        [src]="'assets/images/' + producto.imagen" 
        [alt]="producto.nombre"
        class="mx-auto h-48 object-cover"
    />

    <div class="px-6 py-4">
        <h3 class="font-bold text-xl mb-2 text-gray-800">{{ producto.nombre }}</h3>
        <p class="text-gray-600 text-base mb-4">{{ producto.descripcion }}</p>
        <p class="text-[var(--vintage-rojo)] text-base mb-4">${{ producto.precio }}</p>
    </div>
</div>
